[workspace]
resolver = "3"
members = ["crates/*", "harness/*"]
# Data, not crates — the `harness/*` glob would otherwise try to load it as a member.
exclude = ["harness/datasets"]

# Shared metadata. Members opt in per field with `field.workspace = true`.
[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/Ardnys/binto"

# Dependencies shared across members, so the CLI and the harness can never drift
# to different serde/clap versions.
[workspace.dependencies]
binto-contract = { path = "crates/binto-contract" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Profiles are only honoured at the workspace root.
[profile.release]
strip = true
opt-level = "z"
